[tool.uv.workspace]
members = ["packages/engine", "packages/api"]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "mypy>=1.17",
    "pyinstaller>=6.22.0",
    "pytest>=8.4",
    "pytest-cov>=6.2",
    "ruff>=0.12",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages/engine/src", "packages/api/src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# typer's declarative Option-in-default pattern is the library's documented API
"packages/engine/src/tempest/cli/main.py" = ["B008"]
# A catalog of embedded adversarial payload sources: the strings are code-as-data, uniformly
# f-quoted for brace consistency, and must not be reflowed to satisfy line-length.
"packages/engine/src/tempest/dev/escape_suite.py" = ["E501", "F541"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = ["packages/engine/src", "packages/api/src"]
explicit_package_bases = true
warn_unreachable = true

# _shims.py IS runtime monkey-patching — reassigning stdlib callables is the mechanism, and
# typeshed's precise overloads cannot describe it. Everything else stays fully strict; the
# module's behavior is pinned by 22 execution tests instead.
[[tool.mypy.overrides]]
module = "tempest.determinism._shims"
disable_error_code = ["assignment", "misc", "no-any-return", "unused-ignore", "method-assign"]

[tool.pytest.ini_options]
addopts = "-ra --import-mode=importlib"
testpaths = ["packages/engine/tests", "packages/api/tests"]

[tool.coverage.run]
source_pkgs = ["tempest", "tempest_api"]
branch = true
parallel = true
# Children (the spawned sidecar server, stdio loop) start coverage via
# scripts/covstart/sitecustomize.py when the conftests export COVERAGE_PROCESS_START —
# subprocess code is measured, never excused (100% gate).
concurrency = ["thread"]
sigterm = true
omit = [
    # Phase 2 in progress (behavior pinned by execution tests — HANDOFF trap #8)
    "*/tempest/determinism/*",
    # Verification gates, not product code: corpus_check / roundtrip / parity / orphan_check
    # run as their own commands inside `make verify` and the Phase 9 gate list — measuring
    # their pytest coverage would gate the testers, not the product.
    "*/tempest/dev/*",
]

[tool.coverage.report]
# The 100% bar (owner decision 2026-08-14). Exclusions are EXPLICIT and justified in-line:
# `pragma: no cover — <reason>` for genuinely unreachable-in-context lines, and the platform
# pragmas keep the measured set identical on macOS and Linux (traps 15/20).
fail_under = 100
# Name the missing lines in every report: a red coverage gate on CI must be diagnosable from
# the public checks API alone (the ci.yml failure step surfaces these rows as annotations).
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "pragma: darwin-only",
    "pragma: linux-only",
    "pragma: subprocess-only",
]
