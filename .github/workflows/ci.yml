name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          # v5 auto-caches when package.json declares a `packageManager` (ours does), and that
          # cache step needs pnpm BEFORE `corepack enable` puts it on PATH. Off keeps v4's
          # behaviour; the only thing this bump changes is the Node the action runs on.
          package-manager-cache: false
      - run: corepack enable
      - run: uv sync --all-packages
      # Without node deps the six ts-sidecar bridge tests silently skip and ts_sidecar.py
      # coverage collapses (23% on Linux vs ~full locally) — the 84.23%-vs-85% CI failure.
      # The python suite is only complete with the sidecar installable.
      - run: pnpm install --frozen-lockfile
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy --strict packages/engine/src packages/api/src
      - run: uv run python -m tempest.dev.redaction_check --planted-secrets
      # The C-phase convergence gates (docs/PLAN-V3.md; one make target so CI and local
      # cannot drift): platform-tree attribution (L36.11), the store law (L33), and
      # upstream mergeability (L27) — guarding the 4,200-file vendored tree on every push.
      - run: make verify-convergence
      - name: pytest
        run: |
          set -o pipefail
          uv run pytest packages/engine packages/api -q --cov \
            2>&1 | tee /tmp/pytest.log
        env:
          TEMPEST_DEV: "1"  # permits ProcessSandbox for the first-party pyfix gate (ADR-0008)
      - name: surface pytest failure
        # Actions logs AND job summaries both need a signed-in session, even on a public repo.
        # Check annotations do not — so the failing test lines are emitted as ::error:: too,
        # making a red build diagnosable from the public API alone.
        if: failure()
        run: |
          {
            echo '## pytest failed'
            echo '```'
            tail -n 120 /tmp/pytest.log || echo '(no pytest log captured)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -f /tmp/pytest.log ]; then
            grep -E '^(FAILED|ERROR) ' /tmp/pytest.log | head -n 20 | while IFS= read -r line; do
              echo "::error::$line"
            done
            grep -E '^[0-9]+ (passed|failed)|Required test coverage' /tmp/pytest.log |
              tail -n 3 | while IFS= read -r line; do echo "::error::$line"; done
            # A coverage-gate miss must name its lines publicly: with show_missing on, every
            # non-100% row of the table (path, counts, missing line numbers) becomes an
            # annotation — the only CI output readable without repo-admin auth (trap 12).
            grep -E '^[^ ]+\.py ' /tmp/pytest.log | awk '$NF != "100%"' | head -n 20 |
              while IFS= read -r line; do echo "::error::coverage gap: $line"; done
          else
            echo "::error::pytest produced no log file"
          fi

  bench:
    # Phase 11 perf gate on the 4-core public runner profile. Absolute targets always bind;
    # the 15% regression bar arms once bench/baseline-linux.json is committed (bench_guard
    # prints PENDING(baseline) until then — loud, never silent).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync --all-packages
      - run: make bench
      - run: uv run python -m tempest.dev.bench_guard --max-regression 15
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: bench-json
          path: bench/bench.json

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          # v5 auto-caches when package.json declares a `packageManager` (ours does), and that
          # cache step needs pnpm BEFORE `corepack enable` puts it on PATH. Off keeps v4's
          # behaviour; the only thing this bump changes is the Node the action runs on.
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r test

  desktop:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          # v5 auto-caches when package.json declares a `packageManager` (ours does), and that
          # cache step needs pnpm BEFORE `corepack enable` puts it on PATH. Off keeps v4's
          # behaviour; the only thing this bump changes is the Node the action runs on.
          package-manager-cache: false
      - run: corepack enable
      - run: uv sync --all-packages
      - run: pnpm install --frozen-lockfile
      # tauri-build requires the externalBin staged before any cargo step compiles
      - run: ./packages/desktop/build-server.sh
      - run: cargo clippy --manifest-path packages/desktop/src-tauri/Cargo.toml --workspace --all-targets -- -D warnings
      - run: cargo test --manifest-path packages/desktop/src-tauri/Cargo.toml --workspace
      - run: pnpm --filter @tempest/desktop typecheck
      # The desktop E2E suite: the REAL vite UI against the REAL stdio sidecar, console-clean.
      # It ran only on the author's Mac until now, which is the exposure trap 44 names — 37 specs
      # (the whole editor surface, the contrast gates, the reachability spec) had never once been
      # executed from a fresh checkout. Same runner as the rest of this job so the browser, the
      # sidecar and the fixture all come from one install; @bench is excluded by `test:e2e`
      # because a measurement inside a correctness suite is a measurement taken under load.
      - name: install playwright browser
        run: pnpm --filter @tempest/desktop exec playwright install chromium
      - name: e2e
        run: |
          set -o pipefail
          pnpm --filter @tempest/desktop test:e2e 2>&1 | tee /tmp/e2e.log
        env:
          TEMPEST_DEV: "1"
          TEMPEST_NO_POWER_PAUSE: "1"
      - name: surface e2e failure
        # Same reasoning as the python job: check annotations are readable without a signed-in
        # session, so a red build stays diagnosable from the public API alone.
        if: failure()
        run: |
          {
            echo '## e2e failed'
            echo '```'
            tail -n 150 /tmp/e2e.log || echo '(no e2e log captured)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -f /tmp/e2e.log ]; then
            grep -E '^\s*[0-9]+\) |✘|Error:' /tmp/e2e.log | head -n 20 | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi
      - name: keep the playwright report when it fails
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: packages/desktop/playwright-report
          retention-days: 7

  contract-check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          # v5 auto-caches when package.json declares a `packageManager` (ours does), and that
          # cache step needs pnpm BEFORE `corepack enable` puts it on PATH. Off keeps v4's
          # behaviour; the only thing this bump changes is the Node the action runs on.
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@stable
      - run: corepack enable
      - run: uv sync --all-packages
      - run: pnpm install --frozen-lockfile
      - run: cargo install cargo-typify --locked
      # tauri-build requires the externalBin staged before any cargo step compiles
      - run: ./packages/desktop/build-server.sh
      - run: make gen-contracts
      - run: |
          git diff --exit-code packages/shared-schema \
            packages/desktop/src/generated packages/desktop/src-tauri/src/generated

  forbidden-verdict-grep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: the string SAFE must not appear in the product surface (Law L2)
        run: |
          ! grep -rn --include='*.py' --include='*.ts' --include='*.tsx' -w 'SAFE' packages/

  compose-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker compose -f docker/compose.yaml config -q
