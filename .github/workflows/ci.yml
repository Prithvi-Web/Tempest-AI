name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --all-packages
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy --strict packages/engine/src packages/api/src
      - name: pytest
        run: |
          set -o pipefail
          uv run pytest packages/engine packages/api -q --cov --cov-fail-under=85 \
            2>&1 | tee /tmp/pytest.log
        env:
          TEMPEST_DEV: "1"  # permits ProcessSandbox for the first-party pyfix gate (ADR-0008)
      - name: surface pytest failure in the job summary
        # Actions logs need repo-admin auth to fetch; the job summary is readable from the
        # checks API, so a failure explains itself without anyone opening the web UI.
        if: failure()
        run: |
          {
            echo '## pytest failed'
            echo '```'
            tail -n 120 /tmp/pytest.log || echo '(no pytest log captured)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r test

  desktop:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: uv sync --all-packages
      - run: pnpm install --frozen-lockfile
      # tauri-build requires the externalBin staged before any cargo step compiles
      - run: ./packages/desktop/build-server.sh
      - run: cargo clippy --manifest-path packages/desktop/src-tauri/Cargo.toml --workspace --all-targets -- -D warnings
      - run: cargo test --manifest-path packages/desktop/src-tauri/Cargo.toml --workspace
      - run: pnpm --filter @tempest/desktop typecheck

  contract-check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - run: corepack enable
      - run: uv sync --all-packages
      - run: pnpm install --frozen-lockfile
      - run: cargo install cargo-typify --locked
      # tauri-build requires the externalBin staged before any cargo step compiles
      - run: ./packages/desktop/build-server.sh
      - run: make gen-contracts
      - run: |
          git diff --exit-code packages/shared-schema \
            packages/desktop/src/generated packages/desktop/src-tauri/src/generated

  forbidden-verdict-grep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: the string SAFE must not appear in the product surface (Law L2)
        run: |
          ! grep -rn --include='*.py' --include='*.ts' --include='*.tsx' -w 'SAFE' packages/

  compose-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker compose -f docker/compose.yaml config -q
