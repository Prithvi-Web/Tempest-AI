packages:
  - "packages/shared-schema"
  - "packages/ts-sidecar"
  - "packages/desktop"
  # C3: the vendored client build chain (provider -> client-pkg -> client). Server-side
  # platform packages (data/api/server) join at C5/C6 when their phases wire them.
  - "packages/platform/provider"
  - "packages/platform/client-pkg"
  - "packages/platform/client"
  # C6: the Mongoose data layer. It joins here so that its OWN 66 suites can be run — first
  # against a real mongod to establish the control, then against @tempest/docstore, which is
  # the only way a "green against the selected store" claim means anything (trap 54: a
  # differential check must ask both sides under the same conditions).
  - "packages/platform/data"

# Upstream's `"*"` cross-deps must resolve to the VENDORED workspace packages, never
# the registry copies of the same names (the silent-skew hazard).
linkWorkspacePackages: true

# C6: the vendored data layer's PHANTOM imports — files importing packages their own manifest
# never declares. npm's flat hoisting resolved them upstream; pnpm's strict isolation does not,
# and the vendored manifests must not be edited (L27).
#
# `packageExtensions` below is the sibling mechanism, and it is the wrong one here: it has no
# `devDependencies` field, so every entry would have to be declared a RUNTIME dependency. For
# `mongodb-memory-server-core` that would be an outright false statement — a runtime dependency
# able to fetch an SSPL `mongod`, which is precisely what `store_check --no-sspl-binaries`
# exists to forbid. Hoisting resolves the import while claiming nothing untrue about the graph.
# Every package named here is ALREADY in the store, pulled in by a real dependency; this fetches
# nothing new. (These settings live here, not in `.npmrc`: pnpm 11 reads its own configuration
# from this file — `node_modules/.modules.yaml` recorded `publicHoistPattern: []` when the same
# keys were written to `.npmrc`, which is how that was established rather than assumed.)
#
# Exactly the seven imports below, and nothing else. An earlier draft also listed `*eslint*` and
# `*prettier*` on the grounds that they are pnpm's defaults and that naming any pattern replaces
# them — measured, that was wrong twice: `node_modules/.modules.yaml` recorded
# `publicHoistPattern: []` before this change, so nothing was being replaced, and restating them
# newly hoisted `eslint` to the root of a repository where no manifest asks for it. A C6 change
# has no business altering how eslint resolves.
publicHoistPattern:
  # jest.globalSetup.mjs imports it; package.json declares only `mongodb-memory-server`.
  - "mongodb-memory-server-core"
  # babel.config.cjs names these three, and babel-jest cannot run without @babel/core.
  - "@babel/core"
  - "@babel/preset-env"
  - "@babel/preset-typescript"
  - "babel-plugin-replace-ts-export-assignment"
  # Imported directly by the vendored specs and one type declaration.
  - "uuid"
  - "mongodb"

# Upstream root package.json's security/compat `overrides`, ported npm->pnpm selector
# syntax at C3 (that root manifest is deliberately not vendored; the pins must not be
# lost with it — recorded in packages/platform/UPSTREAM.md).
overrides:
  "minimatch@3>brace-expansion": "^1.1.16"
  "minimatch@5>brace-expansion": "^2.1.2"
  "minimatch@9>brace-expansion": "^2.1.2"
  "minimatch@10>brace-expansion": "^5.0.8"
  "@xmldom/xmldom": "^0.8.13"
  "elliptic": "^6.6.1"
  "form-data": "^4.0.6"
  "langsmith": "^0.6.0"
  "postcss": "^8.5.18"
  "tslib": "^2.8.1"
  "fast-xml-parser": "5.7.2"
  "serialize-javascript": "7.0.5"
  "mdast-util-gfm-autolink-literal": "2.0.0"
  "katex": "^0.16.21"
  "eslint>ajv": "6.14.0"
  "underscore": "1.13.8"
  "hono": "^4.12.25"
  "@hono/node-server": "^2.0.11"
  "monaco-editor>dompurify": "3.4.12"
  "test-exclude": "^8.0.0"
  "js-yaml": "^4.2.0"
  "ws": "^8.21.0"
  "@opentelemetry/core": "^2.9.0"
  "@opentelemetry/propagator-jaeger": "^2.10.0"
  "protobufjs": "^7.6.5"
  "gaxios>uuid": "^11.1.1"
  # Lockfile-skew mirrors: upstream's package-lock.json (not vendored) resolves these
  # exact versions; fresh resolution floats past them and breaks the build (axios>=1.19
  # types vs provider/src/request.ts; react-window 2.x removed the v1 API react-vtree
  # needs). Re-verify at every upstream merge.
  "axios": "1.18.1"
  "react-vtree>react-window": "1.8.11"
  # ONE React, exactly as upstream's flat npm hoisting produces. Without this pin,
  # librechat-data-provider (which declares no react dependency of its own) has its
  # @tanstack/react-query peer auto-resolved against react@19, and the client bundle
  # ships TWO reacts + TWO react-query context instances — React 19's dispatcher is
  # never initialized and the webview dies at render (WKWebView surfaced it first:
  # "null is not an object (evaluating 'E.H.useContext')"). Also the end-state pin:
  # the merged client is React 18 until upstream moves, and the desktop views being
  # absorbed into it are 18-safe.
  "react": "18.3.1"
  "react-dom": "18.3.1"

# npm's flat hoisting let upstream code import undeclared ("phantom") dependencies; pnpm's
# strict isolation exposes them. packageExtensions declares what the code actually imports —
# OUR workspace metadata, zero edits to vendored files. Grown empirically, one build error at
# a time; re-verify at every upstream merge.
packageExtensions:
  "@librechat/frontend":
    dependencies:
      # Versions mirror upstream's package-lock.json resolution.
      katex: "^0.16.21"
      "@rc-component/mini-decimal": "1.1.0"
      axios: "1.18.1"
      dedent: "1.7.0"
      lowlight: "2.9.0"
      react-is: "18.3.1"
      unified: "10.1.2"
      unist-util-visit: "4.1.2"
      uuid: "11.1.1"
      react-zoom-pan-pinch: "3.7.0"
      # C3, the absorbed Tempest views (client/tempest/views): CodeMirror 6 is the editor
      # surface's engine (ADR-0034 — Monaco measured out at 8.1x the bundle) and upstream's
      # client has no CodeMirror at all. Same versions the desktop package declares, so the
      # absorbed editor resolves exactly what it was written and tested against; upstream
      # keeps Monaco for its own surfaces and the two never meet.
      codemirror: "^6.0.2"
      "@codemirror/view": "^6.43.9"
      "@codemirror/state": "^6.7.1"
      "@codemirror/language": "^6.12.4"
      "@codemirror/lang-python": "^6.2.1"
      "@codemirror/lang-javascript": "^6.2.5"
      "@lezer/highlight": "^1.2.3"

allowBuilds:
  esbuild: true
  sharp: true
  # C3, functional postinstalls of the vendored client chain:
  protobufjs: true # writes generated version stubs
  unrs-resolver: true # native resolver binary
  # es5-ext's postinstall prints a message and builds nothing; allowed so the
  # install carries an explicit decision.
  es5-ext: true
  # C6: DENIED, deliberately. mongodb-memory-server's postinstall downloads a MongoDB
  # Community Server binary — ~100 MB of SSPL, which L33 keeps out of the product and which
  # nothing in a plain `pnpm install` or a CI run has any use for. The vendored data layer's
  # own jest globalSetup fetches it lazily via `MongoBinary.getPath()`, so the download
  # happens exactly once, only when a person deliberately takes the C6.0 CONTROL measurement
  # against real MongoDB, and never as a side effect of installing dependencies.
  mongodb-memory-server: false
