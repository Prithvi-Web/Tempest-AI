name: tempest

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: tempest
      POSTGRES_PASSWORD: tempest-dev
      POSTGRES_DB: tempest
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tempest"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: tempest
      MINIO_ROOT_PASSWORD: tempest-dev-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    environment:
      TEMPEST_DATABASE_URL: postgresql+asyncpg://tempest:tempest-dev@postgres:5432/tempest
      TEMPEST_REDIS_URL: redis://redis:6379/0
      TEMPEST_S3_ENDPOINT: http://minio:9000
      TEMPEST_S3_ACCESS_KEY: tempest
      TEMPEST_S3_SECRET_KEY: tempest-dev-secret
      TEMPEST_DEV_AUTH: "1"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  pgdata:
  miniodata:
