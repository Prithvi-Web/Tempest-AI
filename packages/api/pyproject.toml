[project]
name = "tempest-api"
version = "0.1.0"
description = "Tempest AI — bundle ingestion and dashboard API"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "fastapi>=0.116",
    "pydantic>=2.11",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.0",
    "tempest-engine",
    "uvicorn>=0.35",
]

[project.scripts]
tempest-server = "tempest_api.server:main"

[dependency-groups]
dev = [
    "httpx>=0.28",
]

[tool.uv.sources]
tempest-engine = { workspace = true }

[build-system]
requires = ["uv_build>=0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "tempest_api"
