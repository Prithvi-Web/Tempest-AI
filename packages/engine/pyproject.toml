[project]
name = "tempest-engine"
version = "0.1.0"
description = "Tempest AI — behavioral proof engine and CLI"
requires-python = ">=3.12"
dependencies = [
    "rich>=14",
    "typer>=0.16",
]

[project.scripts]
tempest = "tempest.cli.main:app"

[build-system]
requires = ["uv_build>=0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "tempest"
