# Dev-only binaries and integration tests. A separate crate so `tauri build` bundles exactly
# the app binary + the engine sidecar into Tempest.app — never the tooling.
[package]
name = "tempest-desktop-devtools"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
tempest-desktop = { path = ".." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta-typescript = "=0.0.12"
