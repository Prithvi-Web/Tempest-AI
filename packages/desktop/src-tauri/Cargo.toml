[package]
name = "tempest-desktop"
version = "0.1.0"
description = "Tempest — behavioral proof agent. Evidence, not opinion."
authors = ["Tempest"]
edition = "2021"

[lib]
name = "tempest_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
