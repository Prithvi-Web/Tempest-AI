[workspace]
members = [".", "devtools"]

[package]
name = "tempest-desktop"
version = "0.1.0"
description = "Tempest — behavioral proof agent. Evidence, not opinion."
authors = ["Tempest"]
edition = "2021"

[lib]
name = "tempest_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
specta = { version = "=2.0.0-rc.25", features = ["chrono", "serde_json"] }
specta-typescript = "=0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
chrono = { version = "0.4", features = ["serde"] }
regress = "0.10"

# macOS Keychain for the BYOK Anthropic key (keychain.rs) — the key's ONLY storage (L9).
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
