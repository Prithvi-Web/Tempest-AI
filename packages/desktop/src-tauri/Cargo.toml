[workspace]
members = [".", "devtools"]

[package]
name = "tempest-desktop"
version = "0.2.0"
description = "Tempest — behavioral proof agent. Evidence, not opinion."
authors = ["Tempest"]
edition = "2021"

[lib]
name = "tempest_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api: a transparent webview over the vibrancy material (the liquid-glass
# window, master prompt §12) — macOS refuses webview transparency without it.
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
# C3: binary-safe /api bodies across boundary E (the tempest:// protocol handler).
base64 = "0.22"
specta = { version = "=2.0.0-rc.25", features = ["chrono", "serde_json"] }
specta-typescript = "=0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
chrono = { version = "0.4", features = ["serde"] }
regress = "0.10"
# Boundary D (ADR-0035): the Agent Tool Protocol's argument schemas are derived here, so the
# schema a model receives and the type the orchestrator dispatches cannot disagree.
schemars = "0.8"

# macOS Keychain for the BYOK Anthropic key (keychain.rs) — the key's ONLY storage (L9).
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
# The NSVisualEffectView behind the transparent main window — the desktop blur is the OS
# material, not a CSS approximation; the webview only thins its grounds over it.
window-vibrancy = "0.6"
