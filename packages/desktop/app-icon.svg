<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Tempest AI app icon — "storm glass" bolt.
       macOS-style: artwork on an 824x824 squircle centered in a 1024 canvas (Apple grid). -->
  <defs>
    <radialGradient id="abyss" cx="50%" cy="32%" r="85%">
      <stop offset="0%" stop-color="#101B3A"/>
      <stop offset="55%" stop-color="#0A1226"/>
      <stop offset="100%" stop-color="#04060F"/>
    </radialGradient>
    <linearGradient id="bolt" x1="512" y1="240" x2="512" y2="800" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9ED2FF"/>
      <stop offset="45%" stop-color="#5AA8FF"/>
      <stop offset="100%" stop-color="#2E6BF0"/>
    </linearGradient>
    <linearGradient id="rim" x1="512" y1="100" x2="512" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8FB8FF" stop-opacity="0.55"/>
      <stop offset="35%" stop-color="#3E5C9E" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#101B3A" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="sheen" x1="512" y1="100" x2="512" y2="560" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#BFD9FF" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#BFD9FF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="auroraA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2E6BF0" stop-opacity="0.22"/>
      <stop offset="70%" stop-color="#2E6BF0" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#2E6BF0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auroraB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5AA8FF" stop-opacity="0.14"/>
      <stop offset="70%" stop-color="#5AA8FF" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#5AA8FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ground" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2E6BF0" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#2E6BF0" stop-opacity="0"/>
    </radialGradient>
    <filter id="boltGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="34" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="squircle">
      <path d="M512 100c177.6 0 266.4 0 328.2 43.3a232 232 0 0 1 40.5 40.5C924 245.6 924 334.4 924 512s0 266.4-43.3 328.2a232 232 0 0 1-40.5 40.5C778.4 924 689.6 924 512 924s-266.4 0-328.2-43.3a232 232 0 0 1-40.5-40.5C100 778.4 100 689.6 100 512s0-266.4 43.3-328.2a232 232 0 0 1 40.5-40.5C245.6 100 334.4 100 512 100Z"/>
    </clipPath>
  </defs>

  <g clip-path="url(#squircle)">
    <rect x="100" y="100" width="824" height="824" fill="url(#abyss)"/>
    <!-- faint aurora fields, soft falloff -->
    <ellipse cx="330" cy="150" rx="560" ry="360" fill="url(#auroraA)"/>
    <ellipse cx="760" cy="90" rx="460" ry="300" fill="url(#auroraB)"/>
    <!-- glass sheen from the top edge -->
    <rect x="100" y="100" width="824" height="460" fill="url(#sheen)"/>
    <!-- soft ground glow behind the bolt tip -->
    <ellipse cx="512" cy="830" rx="420" ry="200" fill="url(#ground)"/>

    <!-- the bolt: faceted, geometric, optically centered -->
    <g filter="url(#boltGlow)">
      <path d="M577 206 337 556h133l-63 262 280-378H545l90-234Z" fill="url(#bolt)"/>
    </g>
    <!-- facet: darker left half of the bolt for depth -->
    <path d="M577 206 337 556h96Z" fill="#1E4DBF" opacity="0.45"/>
    <path d="M470 556h-30l-33 262Z" fill="#1E4DBF" opacity="0.35"/>
  </g>

  <!-- hairline rim light on the squircle -->
  <path d="M512 103c176.9 0 264.9 0 326.1 42.8a229 229 0 0 1 40.1 40.1C921 247.1 921 335.1 921 512s0 264.9-42.8 326.1a229 229 0 0 1-40.1 40.1C776.9 921 688.9 921 512 921s-264.9 0-326.1-42.8a229 229 0 0 1-40.1-40.1C103 776.9 103 688.9 103 512s0-264.9 42.8-326.1a229 229 0 0 1 40.1-40.1C247.1 103 335.1 103 512 103Z" fill="none" stroke="url(#rim)" stroke-width="6"/>
</svg>
